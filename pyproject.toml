[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "samsarix-creative-spirals"
version = "0.2.0"
description = "Local-first, reviewable social campaign packaging"
readme = "README.md"
requires-python = ">=3.10"
license = "MPL-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Andrew John Ward", email = "contact@samsarix.com" },
    { name = "Samsarix LLC", email = "contact@samsarix.com" },
]
maintainers = [{ name = "Samsarix LLC", email = "support@samsarix.com" }]
keywords = ["content-operations", "local-first", "samsarix", "social-media", "workflow"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "black>=26.3,<27",
    "build>=1.5,<2",
    "flake8>=7.3,<8",
    "mypy>=1.19,<2",
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
]

[project.scripts]
samsarix-campaign = "samsarix_creative_spirals.cli:main"

[project.urls]
Homepage = "https://samsarix.com"
Documentation = "https://github.com/Deathcharge/helix-creative-spirals#readme"
Repository = "https://github.com/Deathcharge/helix-creative-spirals.git"
Issues = "https://github.com/Deathcharge/helix-creative-spirals/issues"

[tool.setuptools]
packages = ["samsarix_creative_spirals"]

[tool.setuptools.package-data]
samsarix_creative_spirals = ["py.typed", "*.json"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
files = ["samsarix_creative_spirals", "tests"]
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers"]

[tool.coverage.run]
branch = true
source = ["samsarix_creative_spirals"]
omit = ["samsarix_creative_spirals/__main__.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
