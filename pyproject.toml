[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "helix-creative-spirals"
version = "0.1.0"
description = "Local-first, reviewable social campaign packaging"
readme = "README.md"
requires-python = ">=3.10"
license = "LicenseRef-Helix-Business-Source-1.1"
license-files = ["LICENSE", "LICENSE.PROPRIETARY"]
authors = [{ name = "Helix Collective" }]
keywords = ["content-operations", "local-first", "social-media", "workflow"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "black>=26.3,<27",
    "build>=1.5,<2",
    "flake8>=7.3,<8",
    "mypy>=1.19,<2",
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
]

[project.scripts]
helix-spirals = "helix_creative_spirals.cli:main"

[project.urls]
Homepage = "https://github.com/Deathcharge/helix-creative-spirals"
Repository = "https://github.com/Deathcharge/helix-creative-spirals.git"
Issues = "https://github.com/Deathcharge/helix-creative-spirals/issues"

[tool.setuptools]
packages = ["helix_creative_spirals"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
files = ["helix_creative_spirals", "tests"]
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers"]

[tool.coverage.run]
branch = true
source = ["helix_creative_spirals"]
omit = ["helix_creative_spirals/__main__.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
