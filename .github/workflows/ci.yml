name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check formatting
        run: python -m black --check samsarix_creative_spirals tests examples
      - name: Lint
        run: python -m flake8 samsarix_creative_spirals tests examples
      - name: Type-check
        run: python -m mypy
      - name: Test
        run: python -m pytest --cov=samsarix_creative_spirals --cov-report=term-missing
      - name: Build distributions
        run: python -m build
      - name: Smoke-test wheel and CLI
        shell: bash
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          samsarix-campaign --version
          # Run from outside the checkout: no repository examples or editable imports required.
          cp examples/evaluate_release.py /tmp/samsarix-evaluate-release.py
          (cd /tmp && python samsarix-evaluate-release.py --output /tmp/samsarix-offline-evaluation)
          samsarix-campaign schema > /tmp/campaign.schema.json
          samsarix-campaign schema --kind plan > /tmp/plan.schema.json
          samsarix-campaign schema --kind approval > /tmp/approval.schema.json
          samsarix-campaign schema --kind plan-approval > /tmp/plan-approval.schema.json
          samsarix-campaign schema --kind approval-policy > /tmp/approval-policy.schema.json
          samsarix-campaign schema --kind plan-approval-set > /tmp/plan-approval-set.schema.json
          samsarix-campaign schema --kind plan-import > /tmp/plan-import.schema.json
          samsarix-campaign schema --kind plan-review > /tmp/plan-review.schema.json
          samsarix-campaign schema --kind adapter > /tmp/adapter.schema.json
          samsarix-campaign schema --kind handoff > /tmp/handoff.schema.json
          samsarix-campaign schema --kind media-package > /tmp/media-package.schema.json
          samsarix-campaign schema --kind publication > /tmp/publication.schema.json
          samsarix-campaign schema --kind readiness > /tmp/readiness.schema.json
          samsarix-campaign schema --kind content-policy > /tmp/content-policy.schema.json
          samsarix-campaign policy validate examples/content-policy.json --json > /tmp/policy-validation.json
          samsarix-campaign check examples/campaign.json --json
          samsarix-campaign preview examples/campaign.json
          samsarix-campaign validate examples/campaign-media.json --json
          samsarix-campaign check examples/campaign-media.json --json
          samsarix-campaign preview examples/campaign-media.json --json
          samsarix-campaign validate examples/campaign-variants.json --json > /tmp/variants-validation.json
          samsarix-campaign check examples/campaign-variants.json --policy examples/content-policy.json --json > /tmp/variants-check.json
          samsarix-campaign preview examples/campaign-variants.json --json > /tmp/variants-preview.json
          samsarix-campaign validate examples/campaign-tracking.json --json > /tmp/tracking-validation.json
          samsarix-campaign check examples/campaign-tracking.json --json > /tmp/tracking-check.json
          samsarix-campaign preview examples/campaign-tracking.json --json > /tmp/tracking-preview.json
          python - <<'PY'
          import json
          from pathlib import Path

          validation = json.loads(Path("/tmp/variants-validation.json").read_text())
          check = json.loads(Path("/tmp/variants-check.json").read_text())
          policy = json.loads(Path("/tmp/policy-validation.json").read_text())
          preview = json.loads(Path("/tmp/variants-preview.json").read_text())
          tracking_validation = json.loads(Path("/tmp/tracking-validation.json").read_text())
          tracking_check = json.loads(Path("/tmp/tracking-check.json").read_text())
          tracking_preview = json.loads(Path("/tmp/tracking-preview.json").read_text())
          drafts = {draft["platform"]: draft["content"] for draft in preview["drafts"]}
          assert validation["valid"] is True
          assert check["publishable"] is True
          assert check["contentPolicy"] == policy["contentPolicy"]
          assert check["issues"][-1]["ruleId"] == "community-salutation-review"
          assert "Turn campaign copy" in drafts["x"]
          assert "A local-first release communications workflow" in drafts["linkedin"]
          assert "**Release workflow update**" in drafts["discord"]
          assert "turns one campaign into deterministic" in drafts["bluesky"]
          assert "turns one campaign into deterministic" in drafts["mastodon"]
          assert "Turn campaign copy" not in drafts["bluesky"]
          tracked_drafts = {
              draft["platform"]: draft["content"] for draft in tracking_preview["drafts"]
          }
          assert tracking_validation["valid"] is True
          assert tracking_check["publishable"] is True
          for platform, content in tracked_drafts.items():
              assert "utm_campaign=creative-spirals-0-12" in content
              assert f"utm_source={platform}" in content
              assert content.index("utm_source=") < content.index("#creative-spirals")
          PY
          samsarix-campaign plan validate examples/launch-plan.json --json
          samsarix-campaign plan check examples/launch-plan.json --policy examples/content-policy.json --json
          samsarix-campaign plan preview examples/launch-plan.json --json
          samsarix-campaign plan diff examples/launch-plan.json examples/launch-plan.json --json --exit-code
          samsarix-campaign plan review create examples/launch-plan.json --decision request-changes --by "CI brand reviewer" --at 2026-08-03T13:45:00Z --finding "Support the opening launch claim." --item 1 --platform linkedin --suggestion "Link the benchmark or narrow the claim." --output /tmp/plan.review.json --json
          samsarix-campaign plan review verify examples/launch-plan.json /tmp/plan.review.json --json
          samsarix-campaign plan import examples/plan-import.csv --name "CI imported release" --required-platform x --required-platform linkedin --output /tmp/imported-release --json
          samsarix-campaign plan check /tmp/imported-release/plan.json --json
          samsarix-campaign plan approval create examples/launch-plan.json --policy examples/content-policy.json --by "CI reviewer" --at 2026-08-03T14:15:00Z --output /tmp/plan.approval.json --json
          samsarix-campaign plan approval verify examples/launch-plan.json /tmp/plan.approval.json --policy examples/content-policy.json --json
          samsarix-campaign plan approval create examples/launch-plan.json --policy examples/content-policy.json --by "CI release owner" --at 2026-08-03T15:00:00Z --output /tmp/plan.release.approval.json --json
          samsarix-campaign plan approval collect examples/launch-plan.json --approval-policy examples/approval-policy.json --approval brand=/tmp/plan.approval.json --approval release-owner=/tmp/plan.release.approval.json --policy examples/content-policy.json --output /tmp/plan.approval-set.json --json
          samsarix-campaign plan approval verify examples/launch-plan.json /tmp/plan.approval-set.json --policy examples/content-policy.json --json
          samsarix-campaign plan handoff create examples/launch-plan.json /tmp/plan.approval-set.json --policy examples/content-policy.json --at 2026-08-04T09:30:00Z --output /tmp/samsarix-quorum-handoff-outbox --json
          QUORUM_HANDOFF_PATH=$(find /tmp/samsarix-quorum-handoff-outbox -mindepth 1 -maxdepth 1 -type d -print -quit)
          samsarix-campaign plan handoff verify examples/launch-plan.json "$QUORUM_HANDOFF_PATH" --json
          samsarix-campaign plan publication init examples/launch-plan.json "$QUORUM_HANDOFF_PATH" --at 2026-08-04T10:00:00Z --output /tmp/quorum-plan.publication.json --json
          samsarix-campaign plan status examples/launch-plan.json --handoff "$QUORUM_HANDOFF_PATH" --at 2026-08-05T12:00:00Z --require-stage handoff --json
          samsarix-campaign plan handoff create examples/launch-plan.json /tmp/plan.approval.json --policy examples/content-policy.json --at 2026-08-04T09:30:00Z --output /tmp/samsarix-handoff-outbox --json
          HANDOFF_PATH=$(find /tmp/samsarix-handoff-outbox -mindepth 1 -maxdepth 1 -type d -print -quit)
          test -f "$HANDOFF_PATH/content-policy.json"
          samsarix-campaign plan handoff verify examples/launch-plan.json "$HANDOFF_PATH" --json
          samsarix-campaign plan publication init examples/launch-plan.json "$HANDOFF_PATH" --at 2026-08-04T10:00:00Z --output /tmp/plan.publication.json --json
          python - "$HANDOFF_PATH" <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path

          path = Path("/tmp/plan.publication.json")
          publication = json.loads(path.read_text())
          for index, record in enumerate(publication["records"], start=1):
              output = Path(f"/tmp/plan.publication-{index}.json")
              subprocess.run([
                  "samsarix-campaign", "plan", "publication", "record",
                  "examples/launch-plan.json", sys.argv[1], str(path),
                  "--item", str(record["sequence"]), "--platform", record["platform"],
                  "--status", "published", "--by", "CI publisher",
                  "--at", "2026-08-04T10:30:00Z", "--assessed-at", "2026-08-05T12:00:00Z",
                  "--url", f"https://social.example/posts/{index}",
                  "--output", str(output), "--json",
              ], check=True)
              assert path.exists()  # Every earlier snapshot is retained.
              path = output
          assert all(r["status"] == "pending" for r in publication["records"])
          subprocess.run([
              "samsarix-campaign", "plan", "publication", "verify",
              "examples/launch-plan.json", sys.argv[1], str(path),
              "--at", "2026-08-05T12:00:00Z", "--json",
          ], check=True)
          subprocess.run([
              "samsarix-campaign", "plan", "status", "examples/launch-plan.json",
              "--handoff", sys.argv[1], "--publication", str(path),
              "--at", "2026-08-05T12:00:00Z", "--require-stage", "publication", "--json",
          ], check=True)
          PY
          samsarix-campaign plan status examples/launch-plan.json --handoff "$HANDOFF_PATH" --at 2026-08-05T12:00:00Z --require-scheduled --require-stage handoff --html /tmp/launch-readiness.html --json
          samsarix-campaign plan export examples/launch-plan.json --output /tmp/samsarix-plan-outbox --json
          python - <<'PY'
          import json
          import struct
          import zlib
          from pathlib import Path

          root = Path("/tmp/samsarix-media-journey")
          (root / "campaigns" / "media").mkdir(parents=True)

          def chunk(kind, data):
              return (
                  struct.pack(">I", len(data)) + kind + data
                  + struct.pack(">I", zlib.crc32(kind + data) & 0xFFFFFFFF)
              )

          image = (
              b"\x89PNG\r\n\x1a\n"
              + chunk(b"IHDR", struct.pack(">IIBBBBB", 1, 1, 8, 6, 0, 0, 0))
              + chunk(b"IDAT", zlib.compress(b"\x00\x0c\x22\x38\xff"))
              + chunk(b"IEND", b"")
          )
          (root / "campaigns" / "media" / "launch.png").write_bytes(image)
          campaign = {
              "schemaVersion": 1,
              "name": "Verified media launch",
              "body": "The exact reviewed image travels with this approved draft.",
              "platforms": ["x", "linkedin", "bluesky", "mastodon", "discord"],
              "media": [{
                  "path": "media/launch.png",
                  "altText": "One-pixel deterministic CI image"
              }],
          }
          plan = {
              "schemaVersion": 1,
              "name": "Verified media sequence",
              "requiredPlatforms": ["x", "linkedin", "bluesky", "mastodon", "discord"],
              "items": [{
                  "campaign": "campaigns/launch.json",
                  "intendedAt": "2026-08-10T13:00:00Z"
              }],
          }
          (root / "campaigns" / "launch.json").write_text(json.dumps(campaign))
          (root / "plan.json").write_text(json.dumps(plan))
          PY
          samsarix-campaign plan approval create /tmp/samsarix-media-journey/plan.json --by "CI visual reviewer" --at 2026-08-03T14:15:00Z --include-media --output /tmp/media-plan.approval.json --json > /tmp/media-approval.json
          samsarix-campaign plan approval verify /tmp/samsarix-media-journey/plan.json /tmp/media-plan.approval.json --json
          samsarix-campaign plan handoff create /tmp/samsarix-media-journey/plan.json /tmp/media-plan.approval.json --at 2026-08-04T09:30:00Z --output /tmp/samsarix-media-handoff-outbox --json > /tmp/media-handoff.json
          MEDIA_HANDOFF_PATH=$(find /tmp/samsarix-media-handoff-outbox -mindepth 1 -maxdepth 1 -type d -print -quit)
          test -f "$MEDIA_HANDOFF_PATH/media-index.json"
          test "$(find "$MEDIA_HANDOFF_PATH/media" -maxdepth 1 -type f | wc -l)" -eq 1
          samsarix-campaign plan handoff verify /tmp/samsarix-media-journey/plan.json "$MEDIA_HANDOFF_PATH" --json
          samsarix-campaign plan status /tmp/samsarix-media-journey/plan.json --handoff "$MEDIA_HANDOFF_PATH" --at 2026-08-05T12:00:00Z --require-stage handoff --json > /tmp/media-status.json
          python - <<'PY'
          import json
          from pathlib import Path

          approval = json.loads(Path("/tmp/media-approval.json").read_text())
          handoff = json.loads(Path("/tmp/media-handoff.json").read_text())
          status = json.loads(Path("/tmp/media-status.json").read_text())
          assert approval["approval"]["media"]["assetCount"] == 1
          assert "media-index.json" in handoff["handoff"]["artifacts"]
          assert status["stage"] == "handoff-ready"
          PY
          samsarix-campaign diff examples/campaign.json examples/campaign-follow-up.json --json
          samsarix-campaign approval create examples/campaign.json --policy examples/content-policy.json --by "CI reviewer" --at 2026-08-02T12:30:00Z --output /tmp/campaign.approval.json --json
          samsarix-campaign approval verify examples/campaign.json /tmp/campaign.approval.json --policy examples/content-policy.json --json
