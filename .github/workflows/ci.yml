name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check formatting
        run: python -m black --check samsarix_creative_spirals tests examples
      - name: Lint
        run: python -m flake8 samsarix_creative_spirals tests examples
      - name: Type-check
        run: python -m mypy
      - name: Test
        run: python -m pytest --cov=samsarix_creative_spirals --cov-report=term-missing
      - name: Build distributions
        run: python -m build
      - name: Smoke-test wheel and CLI
        shell: bash
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          samsarix-campaign --version
          samsarix-campaign schema > /tmp/campaign.schema.json
          samsarix-campaign preview examples/campaign.json
